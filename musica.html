<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Recomendación musical del día | Guía de Madrid</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#183552;background:linear-gradient(150deg,#fff7ed,#f6eef8,#e7f2f6);min-height:100vh}.topbar,main{width:min(1150px,calc(100% - 36px));margin:auto}.topbar{padding:25px 0;display:flex;justify-content:space-between}.topbar a{color:#183552;text-decoration:none;font-weight:800}.hero{padding:55px 0 30px}.tag{font-size:.7rem;font-weight:900;letter-spacing:.14em;color:#8a7188}.hero h1{margin:10px 0 12px;font-family:"Comic Sans MS","Segoe Print",cursive;font-size:clamp(3rem,7vw,6rem);line-height:.95}.hero p{max-width:650px;color:#68798a;font-size:1.05rem}.today{margin:25px 0 50px;padding:30px;border-radius:28px;background:#173653;color:#fff;box-shadow:0 18px 45px #17365326}.today small{letter-spacing:.12em;font-weight:900;color:#bfd6e8}.today h2{margin:9px 0 4px;font-family:"Comic Sans MS","Segoe Print",cursive;font-size:2rem}.today p{margin:0;color:#dbe6ef}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px}.section-head h2{font-family:"Comic Sans MS","Segoe Print",cursive;font-size:2.2rem;margin:0}.section-head span{color:#8493a1;font-size:.85rem}.carousel{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:25px 5px 45px;scrollbar-width:thin}.song{flex:0 0 min(340px,82vw);scroll-snap-align:start;min-height:330px;border-radius:28px;padding:26px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 13px 35px #33465d17}.song:nth-child(3n+1){background:#ffe2d5}.song:nth-child(3n+2){background:#e4e0f5}.song:nth-child(3n){background:#dcefee}.cover{width:100%;aspect-ratio:1.7;border-radius:20px;background:#ffffffa8;display:grid;place-items:center;font-size:4rem;margin-bottom:25px}.song small{font-weight:900;letter-spacing:.1em;color:#74808e}.song h3{font-family:"Comic Sans MS","Segoe Print",cursive;font-size:1.8rem;margin:6px 0 2px}.artist{font-weight:800;color:#566b80}@media(max-width:600px){.hero{padding-top:35px}.today{padding:24px}.section-head{display:block}.section-head span{display:block;margin-top:8px}}</style></head><body><header class="topbar"><a href="index.html">Guía de supervivencia en Madrid</a><a href="index.html">← Volver</a></header><main><section class="hero"><span class="tag">UNA CANCIÓN PARA CADA MOMENTO</span><h1>Recomendación<br>musical del día</h1><p>Una pequeña colección de canciones elegidas personalmente. Desliza para descubrirlas.</p></section><section class="today"><small>♫ CANCIÓN DE HOY</small><h2 id="todayTitle"></h2><p id="todayArtist"></p></section><div class="section-head"><h2>La colección</h2><span>Desliza horizontalmente →</span></div><section class="carousel" id="carousel" aria-label="Recomendaciones musicales"></section></main><script>const songs=[{title:'Vulnerable',artist:'Dani Fernández'},{title:'Chasing Cars',artist:'Tommee Profitt x Fleurie'},{title:'The Goo Goo Dolls',artist:'The Goo Goo Dolls'},{title:'Numb',artist:'Tommee Profitt x Skylar Grey'},{title:'El aire de la calle',artist:'Los Delinqüentes'},{title:'No pide tanto idiota',artist:'Maldita Nerea'},{title:'No podíamos ser agua',artist:'Maldita Nerea'},{title:'Merece la pena',artist:'Pole'},{title:'No estamos tan locos',artist:'Belinda'},{title:'An1mal',artist:'Lola Índigo'},{title:'Haz de luz',artist:'Rayden'},{title:'Lady',artist:'Madrid'}];const carousel=document.getElementById('carousel');songs.forEach((song,i)=>{const card=document.createElement('article');card.className='song';card.innerHTML='<div><div class="cover">'+['♫','♪','♬'][i%3]+'</div><small>RECOMENDACIÓN '+String(i+1).padStart(2,'0')+'</small><h3></h3><div class="artist"></div></div>';card.querySelector('h3').textContent=song.title;card.querySelector('.artist').textContent=song.artist;carousel.append(card)});const now=new Date(),day=Math.floor(new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime()/86400000),song=songs[((day%songs.length)+songs.length)%songs.length];document.getElementById('todayTitle').textContent=song.title;document.getElementById('todayArtist').textContent=song.artist;</script></body></html>
